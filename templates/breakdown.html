{% extends "layout.html" %}

{% block title %}
    Portfolio Breakdown
{% endblock %}

{% block main %}
    <div class="row align-items-end g-4 page-header">
        <div class="col-md-12">
            <p class="section-kicker">Portfolio Breakdown</p>
            <h2>Understand how your portfolio is allocated</h2>
        </div>
    </div>

    <div class="breakdown--empty" id="breakdown--empty">
        <p id="breakdown--empty-text">Add a position to see your portfolio breakdown.</p>
        <p id="breakdown--empty-cash"></p>
    </div>

    <div class="responsive-table">
        <table class="display-table">
            <thead id="portfolio-breakdown-thead"></thead>
            <tbody id="portfolio-breakdown-tbody"></tbody>
        </table>
    </div>

    <div class="chart">
        <canvas id="stock-breakdown-pie"></canvas>
    </div>

    <div class="chart">
        <canvas id="sector-breakdown-pie"></canvas>
    </div>

    <script src="/static/js/breakdown.js"></script>
{% endblock %}
