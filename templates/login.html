{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
    <form class="text-center" action="/login" method="post">
        <div class="container">
            <div class="row justify-content-center mb-3 align-items-center">
                <div class="col-3 text-end">
                    <label>Username:</label>
                </div>
                <div class="col-4">
                    <input class="form-control" name="username" placeholder="Enter username">
                </div>
            </div>

            <div class="row justify-content-center mb-3 align-items-center">
                <div class="col-3 text-end">
                    <label>Password:</label>
                </div>
                <div class="col-4">
                    <input class="form-control" name="password" placeholder="Enter password" type="password">
                </div>
            </div>

            <div class="row justify-content-center mb-3 align-items-center">
                <button class="btn btn-primary mx-auto w-auto" type="submit">Login</button>
            </div>
        </div>
    </form>
{% endblock %}
