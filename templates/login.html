{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
    <div class="page-header text-center">
        <div class="section-kicker">Account</div>
        <h1>Login</h1>
        <p class="section-copy mx-auto">Enter your credentials to access your portfolio.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5">
            <form class="panel-card auth-card" action="/login" method="post">

                <div class="mb-3">
                    <label class="form-label" for="login-username">Username</label>
                    <input class="form-control" name="username" id="login-username" placeholder="Enter username">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="login-password">Password</label>
                    <input class="form-control" name="password" id="login-password" placeholder="Enter password" type="password">
                </div>

                <button class="btn btn-primary btn-width-auto" type="submit">Log In</button>
            </form>
        </div>
    </div>
{% endblock %}
