{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="page-header text-center">
        <div class="section-kicker">Account</div>
        <h1>Register</h1>
        <p class="section-copy mx-auto">Create an account to start building your portfolio.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-5">
            <form class="panel-card" action="/register" method="post">

                <div class="mb-3">
                    <label class="form-label" for="register-username">Username</label>
                    <input class="form-control" name="username" id="register-username" placeholder="Enter username">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="register-password">Password</label>
                    <input class="form-control" name="password" id="register-password" placeholder="Enter password" type="password">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="register-confirmation">Confirm Password</label>
                    <input class="form-control" name="confirmation" id="register-confirmation" placeholder="Enter password again" type="password">
                </div>

                <button class="btn btn-primary btn-width-auto" type="submit">Register</button>
            </form>
        </div>
    </div>
{% endblock %}
